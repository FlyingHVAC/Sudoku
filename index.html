<!DOCTYPE html>
<html lang="en">
<head><meta name="ms-sp-authoring-source" content="agent">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Offline Sudoku with easy, medium, hard levels and pencil notes.">
<title>Sudoku</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#172033;--muted:#687386;--accent:#2563eb;--accent2:#dbeafe;--line:#9aa5b5;--strong:#172033;--bad:#dc2626;--badbg:#fee2e2;--good:#15803d;--cell:min(9.4vw,54px)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e8edf5,#f8fafc);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(96vw,720px);background:var(--panel);border-radius:18px;box-shadow:0 18px 50px #26354925;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.title{margin:0;font-size:clamp(24px,5vw,38px)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,button{font:inherit}select,.action{border:1px solid #c6ced9;background:#fff;color:var(--ink);border-radius:9px;padding:9px 11px;cursor:pointer}.action:hover{background:#f3f6fa}.stats{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;margin:14px 2px 4px}.career{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin:0 0 10px}.board{display:grid;grid-template-columns:repeat(9,var(--cell));grid-template-rows:repeat(9,var(--cell));width:calc(var(--cell)*9);height:calc(var(--cell)*9);margin:auto;border:3px solid var(--strong);background:#fff}.cell{position:relative;width:var(--cell);height:var(--cell);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;color:#1d4ed8;font-size:calc(var(--cell)*.52);font-weight:600;padding:0;cursor:pointer}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.cell.box-right{border-right:3px solid var(--strong)}.cell.box-bottom{border-bottom:3px solid var(--strong)}.cell.given{color:var(--ink);font-weight:800}.cell.peer{background:#f1f5f9}.cell.same{background:#dbeafe}.cell.selected{background:#bfdbfe;outline:3px solid var(--accent);outline-offset:-3px;z-index:2}.cell.error{background:var(--badbg);color:var(--bad)}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:calc(var(--cell)*.19);font-weight:650;color:#475569;line-height:1}.notes span{display:grid;place-items:center}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px auto 0;max-width:560px}.key{min-height:46px;border:0;border-radius:10px;background:#e8eef8;color:#1e3a8a;font-size:20px;font-weight:800;cursor:pointer}.key:hover{background:#dbeafe}.key.active{color:#fff;background:var(--accent)}.key.wide{font-size:14px}.message{min-height:24px;margin:12px 0 0;text-align:center;font-weight:700}.message.bad{color:var(--bad)}.message.good{color:var(--good)}.help{margin:9px 0 0;color:var(--muted);font-size:13px;text-align:center;line-height:1.4}@media(max-width:520px){body{padding:6px}.app{padding:12px;border-radius:12px}.keypad{gap:6px}.key{min-height:43px}.controls{width:100%}.controls select,.controls button{flex:1}.stats{font-size:14px}}@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#172033;--ink:#f8fafc;--muted:#aab4c3;--line:#64748b;--strong:#f8fafc}.app{background:var(--panel)}body{background:#0f172a}.cell{background:#202b3d}.cell.given{color:#fff}.cell.peer{background:#273449}.cell.same{background:#234273}.cell.selected{background:#315a9b}.cell.error{background:#632c36}.stats,.help{color:var(--muted)}select,.action{background:#202b3d;color:#fff;border-color:#526078}.action:hover{background:#2b394f}.key{background:#263752;color:#bfdbfe}.notes{color:#c7d2e2}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1 class="title">Sudoku</h1>
    <div class="controls">
      <label for="level">Level</label>
      <select id="level"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
      <button class="action" id="newGame" type="button">New Game</button>
      <button class="action" id="reset" type="button">Reset</button>
    </div>
  </div>
  <div class="stats"><span id="mistakes">Mistakes: 0</span><span id="timer">00:00</span></div>
  <div class="career" id="career" aria-live="polite"></div>
  <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
  <div class="keypad" aria-label="Number controls">
    <button class="key" data-number="1">1</button><button class="key" data-number="2">2</button><button class="key" data-number="3">3</button><button class="key" data-number="4">4</button><button class="key" data-number="5">5</button>
    <button class="key" data-number="6">6</button><button class="key" data-number="7">7</button><button class="key" data-number="8">8</button><button class="key" data-number="9">9</button><button class="key wide" id="erase">Erase</button>
    <button class="key wide" id="notes" style="grid-column:span 2">Notes: Off</button><button class="key wide" id="check" style="grid-column:span 3">Check Puzzle</button>
  </div>
  <p class="message" id="message" aria-live="polite"></p>
  <p class="help">Select a square, then choose a number. Turn Notes on to place multiple small candidate numbers in one square. Keyboard: 1–9 enters a number, N toggles notes, Backspace/Delete erases, and arrow keys move.</p>
</main>
<script>
(()=>{"use strict";
const puzzles={
easy:[
["530070000600195000098000060800060003400803001700020006060000280000419005000080079","534678912672195348198342567859761423426853791713924856961537284287419635345286179"],
["003020600900305001001806400008102900700000008006708200002609500800203009005010300","483921657967345821251876493548132976729564138136798245372689514814253769695417382"]],
medium:[
["000260701680070090190004500820100040004602900050003028009300074040050036703018000","435269781682571493197834562826195347374682915951743628519326874248957136763418259"],
["200080300060070084030500209000105408000000000402706000301007040720040060004010003","245981376169273584837564219976125438513498627482736951391657842728349165654812793"]],
hard:[
["000000907000420180000705026100904000050000040000507009920108000034059000507000000","483651927659423187271795326162934875795812643348567219926178534834259761517346298"],
["030000080009000500007509200700105008020090030900402001004207100002000800070000090","235761984469328517817549263746135928521896734983472651694287135352914876178653492"]]};
const board=document.getElementById('board'),level=document.getElementById('level'),message=document.getElementById('message'),notesBtn=document.getElementById('notes'),timerEl=document.getElementById('timer'),mistakesEl=document.getElementById('mistakes'),careerEl=document.getElementById('career');
let puzzle='',solution='',values=[],notes=[],given=[],selected=-1,noteMode=false,mistakes=0,seconds=0,timerId=null,finished=false;
let baseSolution='', lastPuzzle='', hasPlayed=false;
const SDK_SETTINGS_KEY='offlineSudoku.settings.v1',SDK_STATS_KEY='offlineSudoku.stats.v1';
const emptyStats=()=>({easy:{wins:0,losses:0,best:null},medium:{wins:0,losses:0,best:null},hard:{wins:0,losses:0,best:null}});
const sdkStorage=(()=>{try{return window.localStorage}catch{return null}})();
function readJSON(k,f){try{return sdkStorage?JSON.parse(sdkStorage.getItem(k))||f:f}catch{return f}}
let sdkStats=readJSON(SDK_STATS_KEY,emptyStats());const savedLevel=readJSON(SDK_SETTINGS_KEY,{}).level;if(puzzles[savedLevel])level.value=savedLevel;
function saveSdk(){if(!sdkStorage)return;sdkStorage.setItem(SDK_SETTINGS_KEY,JSON.stringify({level:level.value}));sdkStorage.setItem(SDK_STATS_KEY,JSON.stringify(sdkStats))}
function showCareer(){const x=sdkStats[level.value];careerEl.textContent=`${level.options[level.selectedIndex].text} stats: Wins ${x.wins} | Losses ${x.losses} | Best ${x.best===null?'--':formatTime(x.best)}`}
function formatTime(t){return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function abandon(){if(hasPlayed&&!finished){sdkStats[level.value].losses++;saveSdk()}}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randomizedGame(){const base=puzzles[level.value][Math.floor(Math.random()*puzzles[level.value].length)];let out;for(let tries=0;tries<20;tries++){const map=shuffled([1,2,3,4,5,6,7,8,9]);const remap=x=>x==='0'?'0':String(map[Number(x)-1]);const ps=base[0].split('').map(remap).join(''),sol=base[1].split('').map(remap).join('');const bands=shuffled([0,1,2]),stacks=shuffled([0,1,2]);const rows=bands.flatMap(b=>shuffled([0,1,2]).map(r=>b*3+r)),cols=stacks.flatMap(b=>shuffled([0,1,2]).map(c=>b*3+c));let np='',ns='';for(const r of rows)for(const c of cols){np+=ps[r*9+c];ns+=sol[r*9+c]}if(Math.random()<.5){let tp='',ts='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){tp+=np[c*9+r];ts+=ns[c*9+r]}np=tp;ns=ts}out=[np,ns];if(np!==lastPuzzle)break}lastPuzzle=out[0];return out}
function newGame(countAbandon=false){if(countAbandon)abandon();saveSdk();const pick=randomizedGame();[puzzle,solution]=pick;values=puzzle.split('').map(Number);given=values.map(Boolean);notes=Array.from({length:81},()=>new Set());selected=-1;noteMode=false;mistakes=0;seconds=0;finished=false;hasPlayed=false;notesBtn.textContent='Notes: Off';notesBtn.classList.remove('active');message.textContent='';message.className='message';clearInterval(timerId);timerId=setInterval(()=>{if(!finished){seconds++;showTimer()}},1000);showTimer();render();showCareer();}
function showTimer(){timerEl.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function render(){board.innerHTML='';for(let i=0;i<81;i++){const r=Math.floor(i/9),c=i%9,b=document.createElement('button');b.type='button';b.className='cell';if(given[i])b.classList.add('given');if(c===2||c===5)b.classList.add('box-right');if(r===2||r===5)b.classList.add('box-bottom');if(selected>=0){const sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc||Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))b.classList.add('peer');if(values[selected]&&values[i]===values[selected])b.classList.add('same');if(i===selected)b.classList.add('selected')}if(values[i]){b.textContent=values[i];if(!given[i]&&values[i]!==Number(solution[i]))b.classList.add('error')}else if(notes[i].size){const n=document.createElement('span');n.className='notes';for(let x=1;x<=9;x++){const s=document.createElement('span');s.textContent=notes[i].has(x)?x:'';n.appendChild(s)}b.appendChild(n)}b.dataset.i=i;b.setAttribute('aria-label',`Row ${r+1}, column ${c+1}${values[i]?`, ${values[i]}`:''}`);board.appendChild(b)}}
function select(i){selected=i;message.textContent='';message.className='message';render()}
function inputNumber(n){if(selected<0||given[selected]||finished)return;hasPlayed=true;if(noteMode){if(values[selected])values[selected]=0;notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n)}else{values[selected]=n;notes[selected].clear();if(n!==Number(solution[selected])){mistakes++;mistakesEl.textContent=`Mistakes: ${mistakes}`}else{removePeerNotes(selected,n)}}render();checkComplete()}
function removePeerNotes(i,n){const r=Math.floor(i/9),c=i%9;for(let j=0;j<81;j++){const rr=Math.floor(j/9),cc=j%9;if(rr===r||cc===c||Math.floor(rr/3)===Math.floor(r/3)&&Math.floor(cc/3)===Math.floor(c/3))notes[j].delete(n)}}
function erase(){if(selected<0||given[selected]||finished)return;values[selected]=0;notes[selected].clear();render()}
function toggleNotes(){noteMode=!noteMode;notesBtn.textContent=`Notes: ${noteMode?'On':'Off'}`;notesBtn.classList.toggle('active',noteMode)}
function checkComplete(){if(values.every((v,i)=>v===Number(solution[i]))){finished=true;clearInterval(timerId);const x=sdkStats[level.value];x.wins++;if(x.best===null||seconds<x.best)x.best=seconds;saveSdk();showCareer();message.textContent='Puzzle complete! Great job.';message.className='message good';render()}}
function checkPuzzle(){if(finished)return;const wrong=values.some((v,i)=>v!==0&&v!==Number(solution[i]));const empty=values.some(v=>v===0);message.textContent=wrong?'Some entries are incorrect.':empty?'Everything entered so far is correct.':'Puzzle complete!';message.className=`message ${wrong?'bad':'good'}`;checkComplete()}
board.addEventListener('click',e=>{const b=e.target.closest('.cell');if(b)select(Number(b.dataset.i))});document.querySelectorAll('[data-number]').forEach(b=>b.addEventListener('click',()=>inputNumber(Number(b.dataset.number))));document.getElementById('erase').addEventListener('click',erase);notesBtn.addEventListener('click',toggleNotes);document.getElementById('check').addEventListener('click',checkPuzzle);document.getElementById('newGame').addEventListener('click',()=>newGame(true));document.getElementById('reset').addEventListener('click',()=>{values=puzzle.split('').map(Number);notes=Array.from({length:81},()=>new Set());mistakes=0;mistakesEl.textContent='Mistakes: 0';message.textContent='';render()});level.addEventListener('change',()=>newGame(true));
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')inputNumber(Number(e.key));else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')erase();else if(e.key.toLowerCase()==='n')toggleNotes();else if(selected>=0&&e.key.startsWith('Arrow')){e.preventDefault();let n=selected;if(e.key==='ArrowLeft')n=Math.max(0,n-1);if(e.key==='ArrowRight')n=Math.min(80,n+1);if(e.key==='ArrowUp')n=Math.max(0,n-9);if(e.key==='ArrowDown')n=Math.min(80,n+9);select(n)}});newGame();
})();
</script>
</body>
</html>
