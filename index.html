<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku</title><style>
:root{color-scheme:light;--cell:min(9.5vw,54px);--ink:#172033;--blue:#1d4ed8;--muted:#687386}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;background:linear-gradient(145deg,#e8edf5,#f8fafc);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}.app{width:min(96vw,720px);padding:18px;background:#fff;border-radius:18px;box-shadow:0 18px 50px #26354925}.top,.stats{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{margin:0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit}.action,select{padding:9px;border:1px solid #c6ced9;border-radius:9px;background:#fff;color:var(--ink)}.stats{margin:14px 2px 4px;color:var(--muted);font-weight:600}.career{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin:0 0 10px}.board{display:grid;grid-template-columns:repeat(9,var(--cell));width:calc(var(--cell)*9);margin:auto;border:3px solid #172033;background:#fff}.cell{position:relative;width:var(--cell);height:var(--cell);padding:0;border:0;border-right:1px solid #9aa5b5;border-bottom:1px solid #9aa5b5;background:#fff;color:var(--blue);font-size:calc(var(--cell)*.52);font-weight:600}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.br{border-right:3px solid #172033}.bb{border-bottom:3px solid #172033}.given{color:#172033;font-weight:800}.peer{background:#f1f5f9}.same{background:#dbeafe}.selected{background:#bfdbfe;outline:3px solid #2563eb;outline-offset:-3px;z-index:2}.error{background:#fee2e2;color:#dc2626}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:calc(var(--cell)*.19);color:#475569}.notes span{display:grid;place-items:center}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px;margin:16px auto 0}.key{min-height:46px;border:0;border-radius:10px;background:#e8eef8;color:#1e3a8a;font-size:20px;font-weight:800}.key.active{background:#2563eb;color:#fff}.wide{font-size:14px}.message{min-height:24px;text-align:center;font-weight:700}.good{color:#15803d}.bad{color:#dc2626}.help{text-align:center;color:var(--muted);font-size:13px}@media(max-width:520px){body{padding:6px}.app{padding:12px}.controls{width:100%}.controls>*{flex:1}.keypad{gap:6px}}
</style></head><body><main class="app"><div class="top"><h1>Sudoku</h1><div class="controls"><label for="level">Level</label><select id="level"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><button class="action" id="new">New Game</button><button class="action" id="reset">Reset</button></div></div><div class="stats"><span id="mistakes">Mistakes: 0</span><span id="timer">00:00</span></div><div class="career" id="career"></div><div class="board" id="board"></div><div class="keypad" id="keys"></div><p class="message" id="message"></p><p class="help">Select a square, then choose a number. Turn Notes on to enter multiple candidate numbers. Keyboard: 1–9, N for notes, and Backspace/Delete to erase.</p></main><script>
(()=>{'use strict';const P={easy:[["530070000600195000098000060800060003400803001700020006060000280000419005000080079","534678912672195348198342567859761423426853791713924856961537284287419635345286179"],["003020600900305001001806400008102900700000008006708200002609500800203009005010300","483921657967345821251876493548132976729564138136798245372689514814253769695417382"]],medium:[["000260701680070090190004500820100040004602900050003028009300074040050036703018000","435269781682571493197834562826195347374682915951743628519326874248957136763418259"],["200080300060070084030500209000105408000000000402706000301007040720040060004010003","245981376169273584837564219976125438513498627482736951391657842728349165654812793"]],hard:[["000000907000420180000705026100904000050000040000507009920108000034059000507000000","483651927659423187271795326162934875795812643348567219926178534834259761517346298"],["030000080009000500007509200700105008020090030900402001004207100002000800070000090","235761984469328517817549263746135928521896734983472651694287135352914876178653492"]]};
const $=x=>document.getElementById(x),board=$('board'),level=$('level'),msg=$('message'),career=$('career'),mist=$('mistakes'),timer=$('timer');const SK='offlineSudoku.settings.v1',TK='offlineSudoku.stats.v1';let storage;try{storage=localStorage}catch{storage=null}const read=(k,f)=>{try{return storage?JSON.parse(storage.getItem(k))||f:f}catch{return f}},blank=()=>({easy:{wins:0,losses:0,best:null},medium:{wins:0,losses:0,best:null},hard:{wins:0,losses:0,best:null}});let stats=read(TK,blank()),saved=read(SK,{});if(P[saved.level])level.value=saved.level;let puzzle='',solution='',v=[],given=[],notes=[],sel=-1,noteMode=false,seconds=0,tick,finished=false,played=false,last='';
function save(){if(storage){storage.setItem(SK,JSON.stringify({level:level.value}));storage.setItem(TK,JSON.stringify(stats))}}function fmt(n){return`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function showStats(){let s=stats[level.value];career.textContent=`${level.options[level.selectedIndex].text} stats: Wins ${s.wins} | Losses ${s.losses} | Best ${s.best==null?'--':fmt(s.best)}`}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function randomPuzzle(){let out;for(let z=0;z<20;z++){let b=P[level.value][Math.floor(Math.random()*P[level.value].length)],map=shuffle([1,2,3,4,5,6,7,8,9]),cv=x=>x==='0'?'0':String(map[+x-1]),p=b[0].split('').map(cv).join(''),s=b[1].split('').map(cv).join(''),bands=shuffle([0,1,2]),stacks=shuffle([0,1,2]),rows=bands.flatMap(x=>shuffle([0,1,2]).map(y=>x*3+y)),cols=stacks.flatMap(x=>shuffle([0,1,2]).map(y=>x*3+y)),np='',ns='';for(let r of rows)for(let c of cols){np+=p[r*9+c];ns+=s[r*9+c]}out=[np,ns];if(np!==last)break}last=out[0];return out}
function newGame(count=false){if(count&&played&&!finished)stats[level.value].losses++;save();[puzzle,solution]=randomPuzzle();v=puzzle.split('').map(Number);given=v.map(Boolean);notes=Array.from({length:81},()=>new Set());sel=-1;noteMode=false;seconds=0;finished=false;played=false;mist.textContent='Mistakes: 0';$('notes').textContent='Notes: Off';$('notes').classList.remove('active');msg.textContent='';clearInterval(tick);tick=setInterval(()=>{if(!finished)timer.textContent=fmt(++seconds)},1000);timer.textContent='00:00';render();showStats();save()}
function render(){board.innerHTML='';for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9,b=document.createElement('button');b.className='cell';if(c===2||c===5)b.classList.add('br');if(r===2||r===5)b.classList.add('bb');if(given[i])b.classList.add('given');if(sel>=0){let sr=Math.floor(sel/9),sc=sel%9;if(r===sr||c===sc||Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3))b.classList.add('peer');if(v[sel]&&v[i]===v[sel])b.classList.add('same');if(i===sel)b.classList.add('selected')}if(v[i]){b.textContent=v[i];if(!given[i]&&v[i]!==+solution[i])b.classList.add('error')}else if(notes[i].size){let q=document.createElement('span');q.className='notes';for(let n=1;n<=9;n++){let x=document.createElement('span');x.textContent=notes[i].has(n)?n:'';q.append(x)}b.append(q)}b.onclick=()=>{sel=i;render()};board.append(b)}}
function input(n){if(sel<0||given[sel]||finished)return;played=true;if(noteMode){v[sel]=0;notes[sel].has(n)?notes[sel].delete(n):notes[sel].add(n)}else{v[sel]=n;notes[sel].clear();if(n!==+solution[sel])mist.textContent=`Mistakes: ${+(mist.textContent.match(/\d+/)||[0])[0]+1}`}render();if(v.every((x,i)=>x===+solution[i])){finished=true;clearInterval(tick);let s=stats[level.value];s.wins++;if(s.best==null||seconds<s.best)s.best=seconds;save();showStats();msg.textContent='Puzzle complete! Great job.';msg.className='message good'}}
const keys=$('keys');for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='key';b.textContent=n;b.onclick=()=>input(n);keys.append(b)}let er=document.createElement('button');er.className='key wide';er.textContent='Erase';er.onclick=()=>{if(sel>=0&&!given[sel]){v[sel]=0;notes[sel].clear();render()}};keys.append(er);let nb=document.createElement('button');nb.id='notes';nb.className='key wide';nb.style.gridColumn='span 2';nb.textContent='Notes: Off';nb.onclick=()=>{noteMode=!noteMode;nb.textContent=`Notes: ${noteMode?'On':'Off'}`;nb.classList.toggle('active',noteMode)};keys.append(nb);let ck=document.createElement('button');ck.className='key wide';ck.style.gridColumn='span 3';ck.textContent='Check Puzzle';ck.onclick=()=>{let bad=v.some((x,i)=>x&&x!==+solution[i]);msg.textContent=bad?'Some entries are incorrect.':'Everything entered so far is correct.';msg.className=`message ${bad?'bad':'good'}`};keys.append(ck);$('new').onclick=()=>newGame(true);$('reset').onclick=()=>{v=puzzle.split('').map(Number);notes=Array.from({length:81},()=>new Set());mist.textContent='Mistakes: 0';render()};level.onchange=()=>newGame(true);document.addEventListener('keydown',e=>{if(/[1-9]/.test(e.key))input(+e.key);else if(e.key==='Delete'||e.key==='Backspace')er.click();else if(e.key.toLowerCase()==='n')nb.click()});newGame()})();
</script></body></html>
